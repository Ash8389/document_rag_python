services:
  ####################################################
  # Kafka (KRaft Mode)
  ####################################################
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      CLUSTER_ID: "abcdefghijklmnopqrstuv"

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - rag-network

  ####################################################
  # Qdrant
  ####################################################
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

    networks:
      - rag-network

  ####################################################
  # Redis Stack
  ####################################################
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"
      - "8001:8001"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - rag-network

  ####################################################
  # Traefik API Gateway
  ####################################################
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"

      - "--api.dashboard=true"
      - "--api.insecure=true"

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - rag-network

  ####################################################
  # Ingestion Service
  ####################################################
  ingestion-service:
    build:
      context: ./ingestion_service

    container_name: ingestion-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    depends_on:
      kafka:
        condition: service_healthy

    # env_file:
    #   - ./ingestion_service/.env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ingest.rule=PathPrefix(`/ingest`)"
      - "traefik.http.routers.ingest.entrypoints=web"
      - "traefik.http.services.ingest.loadbalancer.server.port=8081"

    networks:
      - rag-network

  ####################################################
  # Embedding Service
  ####################################################
  embedding-service:
    build:
      context: ./embedding_service

    container_name: embedding-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    depends_on:
      kafka:
        condition: service_healthy

      # qdrant:
      #   condition: service_healthy

    env_file:
      - ./embedding_service/.env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

    networks:
      - rag-network

  ####################################################
  # Query Service
  ####################################################
  query-service:
    build:
      context: ./query_service

    container_name: query-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    depends_on:
      # qdrant:
      #   condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - ./query_service/.env

    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=PathPrefix(`/chat`)"
      - "traefik.http.routers.chat.entrypoints=web"
      - "traefik.http.services.chat.loadbalancer.server.port=8083"

    networks:
      - rag-network

####################################################
# Networks
####################################################
networks:
  rag-network:
    driver: bridge

####################################################
# Volumes
####################################################
volumes:
  qdrant_data:
  redis_data:
